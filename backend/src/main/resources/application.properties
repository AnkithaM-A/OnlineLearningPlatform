spring.application.name=online-learning-platform
server.port=8080

spring.datasource.url=jdbc:mysql://localhost:3306/online_learning
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.sql.init.mode=${DB_INIT_MODE:always}
spring.sql.init.schema-locations=classpath:db/schema.sql,classpath:db/sample_data.sql,classpath:db/quiz_schema.sql,classpath:db/migrations/V3__course_videos_and_quizzes.sql
app.frontend-url=${FRONTEND_URL:http://localhost:5173}
app.cors.allowed-origins=http://localhost:5173,http://localhost:5176,http://localhost:3000
app.csrf.cookie-same-site=${CSRF_COOKIE_SAME_SITE:Lax}
app.cookies.secure=${SECURE_COOKIES:false}
server.servlet.session.cookie.same-site=${SESSION_COOKIE_SAME_SITE:lax}
server.servlet.session.cookie.secure=${SECURE_COOKIES:false}
app.mail.from=${MAIL_FROM:}
app.password-reset.token-minutes=30

spring.mail.host=${MAIL_HOST:}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
